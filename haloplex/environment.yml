# Conda environment for the HaloPlex Cardio panel pipeline.
#
#   conda env create -f environment.yml
#   conda activate haloplex
#
# GATK 4, not GATK 3 — see README.md "Why GATK 4". Two consequences worth
# knowing up front:
#   1. No manual jar registration. bioconda ships GATK 3 as a wrapper WITHOUT
#      the jar for licensing reasons, so a GATK 3 env is not usable until you
#      download the tarball from the Broad by hand. GATK 4 is installed complete.
#   2. Java 17, not Java 8. GATK 4 wants a modern JDK; GATK 3 required 8.
name: haloplex
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - openjdk=17         # GATK 4 requirement (GATK 3 needed 8 — no longer relevant)
  - gatk4              # HaplotypeCaller, GenomicsDBImport, GenotypeGVCFs, filtering
  - bwa
  - samtools
  - bcftools
  - htslib             # bgzip + tabix
  - picard             # AddOrReplaceReadGroups, CreateSequenceDictionary
  - vcftools           # vcf-concat, vcf-sort, vcf-merge
  - fastqc
  - multiqc            # aggregates per-sample QC across the cohort
  - perl               # ANNOVAR is Perl
  - perl-vcftools-vcf
